name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show macOS toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel
